name = "fparse"
version = "0.0.1"
license = "MIT"
author = "Jacob Williams"
maintainer = "Jacob Williams"
copyright = "Copyright (c) 2026 Jacob Williams."
description = "Fortran function parser"
keywords = ["parser"]

[build]
auto-executables = false
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dev-dependencies]
test-drive = { git = "https://github.com/fortran-lang/test-drive", tag = "v0.5.0" }
# other function parsers (used only by the benchmark test):
fortran_function_parser = { git = "https://github.com/jacobwilliams/fortran_function_parser", tag = "1.1.0" }
feq-parse = { git = "https://github.com/FluidNumerics/feq-parse", rev = "2e80c5940b128a52c5070a3f56909674fb85a379" }
M_calculator = { git = "https://github.com/urbanjost/M_calculator", tag = "v1.0.1" }

[extra.ford]
project = "fparse"
summary = "Fortran function parser"
project_github = "https://github.com/jacobwilliams/fparse"
author = "Jacob Williams"
github = "https://github.com/jacobwilliams"
predocmark_alt = ">"
predocmark = "<"
docmark_alt = ""
docmark = "!"
license = "MIT"
src_dir = ["./src"]
output_dir = "./doc"
display = ["public", "protected", "private"]
source = true
graph = true
sort = "alpha"
search = true
