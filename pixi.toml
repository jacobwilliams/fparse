[workspace]
authors = ["Jacob Williams <jacobwilliams@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "fparse"
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "osx-64", "win-64"]
version = "0.0.1"

[dependencies]
gfortran = "16.*"
fpm = ">=0.13.0,<0.14"
python = "3.13.*"
ford = ">=7.0"

[tasks]
build = "fpm build"
test = "fpm test"
example = "fpm run --example example"
docs = "ford fpm.toml"
benchmark = "fpm test benchmark --profile release -- --update-readme"
benchmark-sparsity = "fpm test benchmark_sparsity --profile release"
